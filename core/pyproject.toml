[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cliwrap-core"
version = "0.1.0"
description = "Shared discovery, config, logging, and base-runner machinery for CLI-tool wrappers."
requires-python = ">=3.11"
dependencies = [
    "nifti-finder>=2.0.0,<3.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["cliwrap_core*"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
